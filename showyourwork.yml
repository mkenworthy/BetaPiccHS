# Enable rule caching on Zenodo?
cache_on_zenodo: true

# Workflow graph (DAG) generation
dag:
  # Generate `dag.pdf` on each build?
  render: false
  # Graphviz layout engine
  engine: sfdp
  # Group files by type into plates?
  group_by_type: false
  # Custom graph attributes
  graph_attr:
    ranksep: "1"
    nodesep: "0.65"
  # Custom node attributes
  node_attr:
    shape: "box"
    penwidth: "2"
    width: "1"

# Externally-hosted datasets, e.g. on Zenodo
datasets:
  10.5281/zenodo.22205930:
    contents:
      gravity_vandalrv_hgcav2.hdf5: src/data/gravity_vandalrv_hgcav2.hdf5
      betapic_astep_2017.csv: src/data/astep/betapic_astep_2017.csv
      betapic_astep_2018.csv: src/data/astep/betapic_astep_2018.csv
      README_ASTEP.md: src/data/astep/README.md
      Reduced_betaPic.fits: src/data/bring/Reduced_betaPic.fits
      betaPic_2015-16-17-18-BHr.dat: src/data/brite/betaPic_2015-16-17-18-BHr.dat
      betaPic_2019_BHr.dat: src/data/brite/betaPic_2019_BHr.dat
      betaPic_2021-BHr-all.dat: src/data/brite/betaPic_2021-BHr-all.dat
      brite_all_R.fits: src/data/brite/brite_all_R.fits
      plot_lecavelierdesetangs1995.py: src/data/lecavelierdesetangs1995/plot_lecavelierdesetangs1995.py
      ReadMe: src/data/lecavelierdesetangs1995/ReadMe
      table: src/data/lecavelierdesetangs1995/table

# Custom file dependencies
dependencies:
  src/scripts/09_CPD_model_mass_59415.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/09_CPD_model_mass_58195.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/08_CPD_model_taumass_59415.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/08_CPD_model_taumass_58195.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/06_1981_fit.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/05_Photometric_data_transits_plots.py:
    - src/data/binned_BRING.dat
    - src/data/binned_ASTEP.dat
    - src/data/binned_BRITE.dat
  src/scripts/plot_m1981model.py:
    - src/data/lecavelierdesetangs1995/ReadMe
    - src/data/lecavelierdesetangs1995/table
  src/scripts/01_orbitalbundles_Beta_Pic_c.py:
    - src/data/gravity_vandalrv_hgcav2.hdf5
# Name of the `.tex` manuscript and corresponding `.pdf` article
ms_name: ms

# Optimize DAG by removing unnecessary jobs upstream of cache hits?
optimize_caching: false

# Overleaf sync settings
overleaf:
  # Overleaf project ID (blank = disabled)
  id:
#    id: 6961716b1f368871d240c349
  # Perform sync on GitHub Actions?
  gh_actions_sync: true
  # List of files to push to Overleaf
  push:
    - src/tex/figures
    - src/tex/output
  # List of files to pull from Overleaf
  pull:
    - src/tex/ms.tex
    - src/tex/bib.bib
    - src/tex/aa_url.bst

# Always require all input files to be present on disk for workflow to pass?
require_inputs: true

# Allow cacheable rules to run on GitHub Actions?
run_cache_rules_on_ci: false

# Mapping of script file extensions to instructions for executing them
scripts:
  py: python {script}

# Display of the `showyourwork` stamp on first page
stamp:
  # Show the stamp?
  enabled: true
  # Stamp angle in degrees
  angle: -20.0
  # Stamp size in inches
  size: 0.75
  # Horizontal position in inches from right edge of paper
  xpos: 0.50
  # Vertical position in inches from top edge of paper
  ypos: 0.50
  # Display of the repo URL in the stamp
  url:
    # Show the URL?
    enabled: true
    # Maximum URL length to display
    maxlen: 40

# Enable SyncTeX?
synctex: True

# Command-line options to be passed to tectonic when building the manuscript
tectonic_args: []

# Preprocessing script for arXiv tarball
# (such as to switch `minted` from `finalizecache` to `frozencache`)
# The script will be passed a directory containing the manuscript source
# as input, and should modify the contents of that directory in-place.
# preprocess_arxiv_script: my_preprocess_script.sh

# Enable verbose output?
verbose: true

# Version of `showyourwork` used to create this workflow
version: 0.4.4.dev262+gda6a44163
